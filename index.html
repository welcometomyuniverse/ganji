<style>
  :root { --bg:#121417; --panel:#1b1f24; --line:#2e353d; --ink:#e8e4da;
          --dim:#9aa3ad; --gold:#c9ae6a; --goldhi:#ffd98a;
          --edge:rgba(12,12,14,.9);
          --shadow: 0 0 3px rgba(0,0,0,.95), 0 1px 3px rgba(0,0,0,.9),
                    0 4px 16px rgba(0,0,0,.65);
          --hanja: "Songti SC","STSong","SimSun","Yu Mincho",serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.75 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  a { color:var(--gold); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .wrap { max-width:960px; margin:0 auto; padding:0 22px; }

  /* ── 머리 ── */
  header { display:flex; align-items:center; gap:14px; padding:20px 0; }
  .logo { font-size:20px; letter-spacing:.3em; color:var(--gold); font-weight:700; }
  .logo small { font-size:12px; letter-spacing:.1em; color:var(--dim); font-weight:400;
                display:block; }
  header .grow { flex:1; }
  select#lang { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                border-radius:8px; padding:6px 10px; font-size:13px; }

  /* ── 히어로 ── */
  .hero { text-align:center; padding:38px 0 8px; }
  .hero h1 { font-size:clamp(26px, 4.6vw, 40px); line-height:1.35; margin:0 0 10px; }
  .hero h1 em { font-style:normal; color:var(--goldhi); }
  .hero p.sub { color:var(--dim); font-size:17px; max-width:620px; margin:0 auto 26px; }
  .cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:26px 0 8px; }
  .btn { display:inline-block; border-radius:11px; padding:13px 26px; font-size:16px;
         font-weight:700; }
  .btn.buy { background:#3d3120; color:#f4e8c8; border:1px solid #8a6d2f; }
  .btn.buy:hover { background:#4a3c27; text-decoration:none; }
  .btn.trial { background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  .btn.trial:hover { border-color:var(--gold); text-decoration:none; }
  .cta-note { font-size:13px; color:var(--dim); }

  /* ── 판 데모 (제품과 같은 규칙으로 그린다) ── */
  .board { position:relative; margin:34px auto 6px; padding:34px 10px 22px;
           max-width:640px; background:#17191d; border:1px solid #23282e;
           border-radius:16px; overflow:hidden; }
  .pillars { display:flex; gap:clamp(14px,4vw,30px); justify-content:center;
             text-shadow:var(--shadow); position:relative; z-index:2; }
  .pillar { text-align:center; }
  .plabel { font-size:12px; color:var(--dim); letter-spacing:.3em; text-indent:.3em;
            margin-bottom:6px; }
  .hanja { font-family:var(--hanja); font-size:clamp(46px,9vw,72px); line-height:1.08;
           font-weight:600; }
  .hanja span { display:block; -webkit-text-stroke:2.4px var(--edge); }
  .reading { font-size:12px; color:var(--dim); margin-top:3px; letter-spacing:.15em; }
  .wood  { color:#6fd68b; } .fire { color:#ff6f61; } .earth { color:#f2c14e; }
  .metal { color:#f6f4ec; }
  .water { color:#1d1d24; -webkit-text-stroke-color:rgba(250,248,240,.95);
           text-shadow:0 0 3px rgba(255,255,255,.9), 0 1px 4px rgba(255,255,255,.55); }
  .hanja .metal, .hanja .water { -webkit-text-stroke-width:1.8px; }
  .board svg.arc { position:absolute; inset:0; width:100%; height:100%; z-index:1;
                   pointer-events:none; }
  .board .hint { text-align:center; font-size:12.5px; color:#7d8792; margin-top:14px;
                 position:relative; z-index:2; }

  /* ── 본문 ── */
  section { padding:34px 0 6px; }
  h2 { font-size:22px; color:var(--goldhi); margin:0 0 6px; }
  .lead { color:var(--dim); margin:0 0 22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr));
          gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:13px;
          padding:18px 20px; }
  .card h3 { margin:0 0 8px; font-size:16.5px; color:var(--ink); }
  .card p { margin:0; font-size:14.5px; color:var(--dim); }

  /* ── 가격 ── */
  .price { background:var(--panel); border:1px solid #8a6d2f55; border-radius:16px;
           padding:30px 26px; text-align:center; margin-top:20px; }
  .price .amount { font-size:38px; font-weight:800; color:var(--goldhi); }
  .price .amount small { font-size:16px; color:var(--dim); font-weight:400; }
  .price ul { list-style:none; padding:0; margin:16px auto 20px; max-width:430px;
              text-align:left; font-size:14.5px; color:var(--dim); }
  .price li { padding:4px 0 4px 24px; position:relative; }
  .price li::before { content:"◆"; position:absolute; left:2px; color:var(--gold);
                      font-size:10px; top:9px; }

  /* ── FAQ·바닥 ── */
  .faq .card { margin-bottom:12px; }
  footer { margin-top:46px; padding:26px 0 40px; border-top:1px solid var(--line);
           font-size:13px; color:var(--dim); }
  footer .biz { margin-top:6px; font-size:12px; color:#6b7480; }
</style>
</head>

function apply(lang) {
  const d = S[lang] || S.ko;
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-i18n]")) {
    const v = d[el.dataset.i18n]; if (v !== undefined) el.textContent = v;
  }
  for (const el of document.querySelectorAll("[data-i18n-html]")) {
    const v = d[el.dataset.i18nHtml]; if (v !== undefined) el.innerHTML = v;
  }
  const mail = "mailto:support.saydam@gmail.com?subject=" +
    encodeURIComponent(d.mail_subject) + "&body=" + encodeURIComponent(d.mail_body);
  document.getElementById("buyBtn").href = mail;
  document.getElementById("buyBtn2").href = mail;
  try { localStorage.setItem("ganji_lang", lang); } catch (_) {}
}
const sel = document.getElementById("lang");
let lang = new URLSearchParams(location.search).get("lang");
try { lang = lang || localStorage.getItem("ganji_lang"); } catch (_) {}
if (!lang) {
  const n = (navigator.language || "ko").toLowerCase();
  lang = n.startsWith("ko") ? "ko" : n.startsWith("ja") ? "ja"
       : (n.startsWith("zh") ? "zh-Hant" : "en");
}
if (!S[lang]) lang = "ko";
sel.value = lang;
sel.onchange = () => apply(sel.value);
apply(lang);
</script>
